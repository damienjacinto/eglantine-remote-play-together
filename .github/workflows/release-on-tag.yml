name: Release on tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest
          - os_name: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Steam's runtime library ships in the release. It is taken from the Steamworks.NET
      # release for Steamworks SDK 1.65, whose copies are byte-identical to Valve's
      # redistributable_bin/; both the archive and the library are checked against pinned hashes.
      - name: Download Steam runtime library
        id: steam_api
        shell: bash
        env:
          ARCHIVE_URL: https://github.com/rlabrecque/Steamworks.NET/releases/download/2025.165.0/Steamworks.NET-Standalone_2025.165.0.zip
          ARCHIVE_SHA256: 9b86dda48b257013a350c8fea87edf3ab3f6f8fd6a812563fddec73fb1189fee
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              library=Windows-x64/steam_api64.dll
              library_sha256=e6d9bafb9a41e42fba7b21553db49f8719027af3f0deb23ff86cfc44d60e776d ;;
            macOS)
              library=OSX-Linux-x64/steam_api.bundle/Contents/MacOS/libsteam_api.dylib
              library_sha256=a37faf19675b943a3c9717d25d9a881f5addb7f0ee728e03de7aac143ba759d2 ;;
            *)
              library=OSX-Linux-x64/libsteam_api.so
              library_sha256=eb2dd015b84177cf4f4326fe578aab375fd8931bbbd719c7492420d9777007fe ;;
          esac
          check() {
            if command -v sha256sum > /dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi
          }
          mkdir -p steam_api && cd steam_api
          curl -fsSL "$ARCHIVE_URL" -o archive.zip
          echo "$ARCHIVE_SHA256  archive.zip" | check
          cmake -E tar xf archive.zip
          echo "$library_sha256  $library" | check
          dir="$(pwd)"
          if [ "${{ runner.os }}" = Windows ]; then dir="$(cygpath -m "$dir")"; fi
          echo "path=$dir/$library" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTEAM_API_LIBRARY="${{ steps.steam_api.outputs.path }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/dev.eglantine.remote-play-together-${{ matrix.os_name }}-${{ github.ref_name }}.tar.gz" \
            -C build dev.eglantine.remote-play-together

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/dev.eglantine.remote-play-together -DestinationPath "dist/dev.eglantine.remote-play-together-windows-${{ github.ref_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-play-together-${{ matrix.os_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
